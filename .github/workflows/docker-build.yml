name: Build and Push Docker Image

on:
  push:
    branches:
      - 'main'
      - 'master'
    tags:
      - 'v*' # Triggert bei Releases wie v0.1.0

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: docker/checkout@v4

      # Richtet QEMU ein (wichtig, falls man Multi-Architektur bauen will, hier optional)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Richtet Buildx ein (Nutzung von erweiterten Docker-Caches)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Loggt sich mit den GitHub-eigenen Tokens in die GitHub Registry ein
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generiert automatische Docker-Tags (z.B. "latest" oder die Commit-SHA)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      # Der eigentliche Bau und Push-Prozess
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Nutzt den GitHub-internen Cache, damit Folgebau-Vorgänge in wenigen Minuten durch sind
          cache-from: type=gha
          cache-to: type=gha,mode=max

