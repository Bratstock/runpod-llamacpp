name: Build and Push Docker Image

on:
  push:
    branches:
      - 'main'
      - 'master'
    tags:
      - 'v*' # triggered by releases like v0.1.0

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up QEMU (important for multi-architecture builds, optional here)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Buildx (enables extended Docker caches)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to the GitHub container registry using GitHub's own tokens
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate automatic Docker tags (e.g. "latest" or the commit SHA)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      # The actual build and push
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Uses GitHub's internal cache so subsequent builds finish within minutes
          cache-from: type=gha
          cache-to: type=gha,mode=max

